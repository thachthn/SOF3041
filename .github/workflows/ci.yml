name: CI - Automation Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Smoke test
  # ============================================================
  smoke:
    name: Smoke Test (JUnit, nhóm smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Chạy smoke test
        # Đã xóa working-directory, chạy trực tiếp ở thư mục gốc
        run: mvn -B test -Dgroups=smoke

      - name: Upload Surefire report (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          # Đã sửa lại đường dẫn bỏ chữ webapp/
          path: target/surefire-reports/

  # ============================================================
  # Job 2: Regression test
  # ============================================================
  regression:
    name: Regression Test (JUnit đầy đủ)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Chạy toàn bộ unit/integration test (JUnit)
        run: mvn -B test

      - name: Upload Surefire report (regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-report
          path: target/surefire-reports/

  # ============================================================
  # Job 3: UI test bằng Selenium
  # ============================================================
  ui-test:
    name: UI Test (Selenium, nhóm ui)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Chạy Selenium UI test
        run: mvn -B test -Dgroups=ui

      - name: Upload Surefire report (UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: target/surefire-reports/

      - name: Upload screenshot khi test fail (nếu có)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-failure-screenshots
          path: target/screenshots/
          if-no-files-found: ignore
