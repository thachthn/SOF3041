name: CI - Automation Test

# Y5: Tự động chạy test khi push/pull request vào nhánh main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Cho phép chạy thủ công từ tab Actions trên GitHub, tiện khi demo/bảo vệ
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Smoke test - nhóm test quan trọng nhất, chạy nhanh,
  # dùng để kiểm tra nhanh "ứng dụng có còn sống" sau mỗi commit.
  # ============================================================
  smoke:
    name: Smoke Test (JUnit, nhóm smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Chạy smoke test
        working-directory: ./webapp
        run: mvn -B test -Dgroups=smoke

      - name: Upload Surefire report (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: webapp/target/surefire-reports/

  # ============================================================
  # Job 2: Regression test - toàn bộ JUnit test (trừ Selenium UI,
  # vì UI test tốn thời gian hơn và cần trình duyệt riêng).
  # ============================================================
  regression:
    name: Regression Test (JUnit đầy đủ)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Chạy toàn bộ unit/integration test (JUnit)
        working-directory: ./webapp
        run: mvn -B test

      - name: Upload Surefire report (regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-report
          path: webapp/target/surefire-reports/

  # ============================================================
  # Job 3: UI test bằng Selenium - chạy trên Chrome headless.
  # ubuntu-latest đã cài sẵn Chrome, WebDriverManager tự đồng bộ
  # phiên bản ChromeDriver tương ứng.
  # ============================================================
  ui-test:
    name: UI Test (Selenium, nhóm ui)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Chạy Selenium UI test
        working-directory: ./webapp
        run: mvn -B test -Dgroups=ui

      - name: Upload Surefire report (UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: webapp/target/surefire-reports/

      - name: Upload screenshot khi test fail (nếu có)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-failure-screenshots
          path: webapp/target/screenshots/
          if-no-files-found: ignore
