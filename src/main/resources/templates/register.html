<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container">
      <h1>Đăng ký tài khoản</h1>

      <div
        th:if="${error}"
        class="error"
        id="error-msg"
        th:text="${error}"
      ></div>

      <form method="post" th:action="@{/register}" id="register-form">
        <label for="username">Tên đăng nhập</label>
        <input
          type="text"
          id="username"
          name="username"
          th:value="${username}"
          required
          placeholder="Chọn tên đăng nhập"
        />

        <label for="email">Địa chỉ Email</label>
        <input
          type="email"
          id="email"
          name="email"
          th:value="${email}"
          required
          placeholder="ví dụ: abc@gmail.com"
        />

        <label for="password">Mật khẩu</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          placeholder="Tạo mật khẩu"
        />

        <button type="submit" id="register-submit">Đăng ký</button>
      </form>
      <p>
        Đã có tài khoản?
        <a th:href="@{/login}" id="go-login">Đăng nhập tại đây</a>
      </p>
    </div>
  </body>
</html>
