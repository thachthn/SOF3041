<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${product.id} != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'">
      Sản phẩm
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container">
      <h1
        th:text="${product.id} != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'"
      ></h1>
      <form
        method="post"
        th:action="${product.id} != null ? @{/products/{id}(id=${product.id})} : @{/products}"
        id="product-form"
      >
        <label for="name">Tên sản phẩm</label>
        <input
          type="text"
          id="name"
          name="name"
          th:value="${product.name}"
          required
          placeholder="Nhập tên sản phẩm"
        />

        <label for="description">Mô tả</label>
        <input
          type="text"
          id="description"
          name="description"
          th:value="${product.description}"
          placeholder="Nhập mô tả"
        />

        <label for="price">Giá</label>
        <input
          type="number"
          step="0.01"
          min="0"
          id="price"
          name="price"
          th:value="${product.price}"
          required
          placeholder="0.00"
        />

        <label for="quantity">Số lượng</label>
        <input
          type="number"
          step="1"
          min="0"
          id="quantity"
          name="quantity"
          th:value="${product.quantity}"
          required
          placeholder="0"
        />

        <button type="submit" id="save-product-btn">Lưu</button>
        <a class="btn" th:href="@{/products}" style="background-color: #757575"
          >Huỷ</a
        >
      </form>
    </div>
  </body>
</html>
